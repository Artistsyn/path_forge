[package]
name = "path_forge"
version = "0.1.0"
edition = "2021"
description = "Path / corridor environment GIF creator — PathForge 2.0 (Rust port of PathForgeLive.jsx)"

[[bin]]
name = "path_forge"
path = "src/main.rs"

[dependencies]
eframe     = { version = "0.29", features = ["wgpu"] }
egui       = "0.29"
image      = { version = "0.25", default-features = false, features = ["png"] }
gif        = "0.13"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
