[package]
name = "path_forge"
version = "0.1.0"
edition = "2021"
description = "Path / corridor environment GIF creator — PathForge 2.0 (Rust port of PathForgeLive.jsx)"

[workspace]
members = [".", "runtime", "mobile"]
# `cargo build` at the top builds PathForge; `cargo build -p path_forge_runtime` the game library;
# `mobile` is the phone apps' library (built by android/build-native.sh and ios/build-native.sh).
default-members = ["."]

[[bin]]
name = "path_forge"
path = "src/main.rs"
required-features = ["studio"]

[[bin]]
name = "pf"
path = "src/bin/pf.rs"
required-features = ["gpu"]

[[bin]]
name = "pf_mcp"
path = "src/bin/pf_mcp.rs"

[features]
# The studio (egui) and the GPU renderers of the 2.0 app. A game embedding the runtime builds
# without them: `path_forge = { path = "...", default-features = false }`.
default = ["studio"]
studio = ["dep:eframe", "dep:egui", "dep:rfd", "gpu"]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
eframe = { version = "0.36", features = ["wgpu"], optional = true }
egui = { version = "0.36", optional = true }
image      = { version = "0.25", default-features = false, features = ["png"] }
gif        = "0.13"
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rfd = { version = "0.14", optional = true }
wgpu = { version = "30.0.1", optional = true }
pollster = { version = "0.3", optional = true }
bytemuck = { version = "1.16", features = ["derive"], optional = true }
rayon = "1"
png = "0.18"
schemars = "1"
base64 = "0.22"
# Share codes: scenes compressed into a line of text, and QR codes of them.
miniz_oxide = "0.8"
qrcode = { version = "0.14", default-features = false }
webp-animation = "0.10"

# The road's device on a low-priority queue, made through wgpu-hal (gpu::GpuContext::yielding_device).
[target.'cfg(target_os = "android")'.dependencies]
ash = "0.38"
log = "0.4"
