plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pathforge.mobile'
    compileSdk 34

    defaultConfig {
        applicationId 'com.pathforge.mobile'
        minSdk 29
        targetSdk 34
        // Each CI build counts up, so a newer APK installs over an older one.
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        // A key for installing the app yourself (sideloading). Its passwords are not secret;
        // publishing to a store needs a key of your own.
        sideload {
            storeFile file('sideload.keystore')
            storePassword 'pathforge'
            keyAlias 'pathforge'
            keyPassword 'pathforge'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
        debug {
            signingConfig signingConfigs.sideload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
