# Builds the iPhone app (ios/) unsigned, and publishes it as the "ios-latest" release. Install it
# with Sideloadly or AltStore and a free Apple ID (they sign it on the way in); see ios/README.md.
name: iPhone app

on:
  push:
    paths:
      - 'ios/**'
      - 'mobile/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Rust for iPhone
        run: rustup target add aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios

      - name: Build the renderer (libpathforge.a)
        run: ios/build-native.sh

      - name: Make the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build the app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project PathForge.xcodeproj -target PathForge -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" MARKETING_VERSION="1.0.$GITHUB_RUN_NUMBER" build | tail -n 200

      - name: Package the IPA
        working-directory: ios
        run: |
          test -d build/Release-iphoneos/PathForge.app
          mkdir -p Payload
          cp -R build/Release-iphoneos/PathForge.app Payload/
          zip -qry ../PathForge.ipa Payload
          ls -la ../PathForge.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PathForge-ipa
          path: PathForge.ipa

      - name: Publish as the ios-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest --yes --cleanup-tag || true
          gh release create ios-latest PathForge.ipa --prerelease --target "$GITHUB_SHA" \
            --title "PathForge for iPhone (latest build)" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Unsigned: install it with Sideloadly or AltStore and a free Apple ID (see ios/README.md in the repository). Apps installed this way expire after 7 days; install it again (or let AltStore refresh it) to keep using it."
