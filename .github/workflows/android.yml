# Builds the Android app (android/) and publishes the APK as the "android-latest" release, so it
# can be downloaded straight onto a phone from the repository's Releases page.
name: Android app

on:
  push:
    paths:
      - 'android/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rust for Android
        run: rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build the renderer (libpathforge.so)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          android/build-native.sh
          ls -la android/app/src/main/jniLibs/arm64-v8a

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk PathForge.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PathForge-apk
          path: PathForge.apk

      - name: Publish as the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest PathForge.apk --prerelease --target "$GITHUB_SHA" \
            --title "PathForge for Android (latest build)" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. On your phone: download PathForge.apk, open it, and allow installing from this source when asked. Newer builds install over older ones."
